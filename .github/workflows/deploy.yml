name: Deploy BukuCepat ke GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verifikasi & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfigurasi GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Instal dependensi
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Jalankan lint & typecheck
        run: npm run lint

      - name: Jalankan pengujian otomatis
        run: npm test

      - name: Build produksi untuk GitHub Pages
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Siapkan berkas .nojekyll & fallback 404 SPA
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Unggah artefak GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy ke GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy artefak ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
